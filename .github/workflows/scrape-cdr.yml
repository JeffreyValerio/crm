name: Scrape CDR (Interphone)

on:
  schedule:
    - cron: '0 13-23 * * *'  # 7 AM–5 PM CST (UTC-6): 13–23 UTC
    - cron: '0 0-2 * * *'    # 6 PM–8 PM CST: 0–2 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL }}
      DATABASE_SSL_REJECT_UNAUTHORIZED: 'false'
      INTERPHONE_URL: ${{ secrets.INTERPHONE_URL }}
      INTERPHONE_USERNAME: ${{ secrets.INTERPHONE_USERNAME }}
      INTERPHONE_PASSWORD: ${{ secrets.INTERPHONE_PASSWORD }}
      CI: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Scrape CDR
        run: npx tsx scripts/scrape-cdr.ts 1
